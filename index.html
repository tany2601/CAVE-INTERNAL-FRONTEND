    <title>CAVE Saloon</title>
    <style>
      /* Painted before the app bundle loads, so launching or reopening never flashes white. */
      html { background: #090909; }
      html[data-theme="light"] { background: #f7f7f5; }
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 28px; background: #090909;
        transition: opacity 0.45s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash img { width: min(46vw, 240px); height: auto; }
      #splash span {
        width: 42px; height: 2px; border-radius: 2px; background: rgba(255,255,255,0.14);
        position: relative; overflow: hidden;
      }
      #splash span::after {
        content: ""; position: absolute; inset: 0; width: 40%; background: #f5f5f5;
        animation: splash-run 1.1s ease-in-out infinite;
      }
      @keyframes splash-run { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    </style>
    <script>
      try {
        if (localStorage.getItem("cave-theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- Launch splash: visible from the first paint, removed by main.tsx after a few seconds. -->
    <div id="splash" aria-hidden="true">
      <img src="/brand/cave-logo.png" alt="" />
      <span></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
